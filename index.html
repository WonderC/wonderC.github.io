<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心灵鸡汤 | 温暖你的每一天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fdf6e9 0%, #f5e6d3 50%, #e8d5c4 100%);
            padding: 20px;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        .title {
            font-size: 2rem;
            color: #8b6f47;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #a89070;
            margin-bottom: 40px;
            font-style: italic;
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(139, 111, 71, 0.15);
            margin-bottom: 30px;
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
        }

        .quote-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(139, 111, 71, 0.2);
        }

        .quote-text {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #5d4e37;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .quote-author {
            font-size: 0.95rem;
            color: #a89070;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(135deg, #d4a574 0%, #c4956a 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 165, 116, 0.4);
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 165, 116, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .decorative {
            font-size: 2rem;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.5rem;
            }
            .quote-text {
                font-size: 1.2rem;
            }
            .quote-card {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🍵 心灵鸡汤</h1>
        <p class="subtitle">温暖你的每一天</p>
        
        <div class="quote-card">
            <div class="decorative">✨</div>
            <p class="quote-text" id="quote">加载中...</p>
            <p class="quote-author" id="author"></p>
        </div>
        
        <button class="btn" onclick="newQuote()">再来一句</button>
    </div>

    <script>
        const quotes = [
            { text: "生活不是等待暴风雨过去，而是学会在雨中跳舞。", author: "维维安·格林" },
            { text: "每一天都是新的开始，带着希望醒来，带着感恩入睡。", author: "未知" },
            { text: "你比昨天更强大了一点，这就是进步。", author: "未知" },
            { text: "温柔对待自己，你也是宇宙中独一无二的星星。", author: "未知" },
            { text: "慢慢来，好的事情正在路上。", author: "未知" },
            { text: "今天的努力，是明天惊喜的铺垫。", author: "未知" },
            { text: "允许自己休息，但不要忘记继续前行。", author: "未知" },
            { text: "你值得拥有所有美好，包括对自己的爱。", author: "未知" },
            { text: "每一次呼吸，都是生命给你的礼物。", author: "未知" },
            { text: "不必完美，只要真实就好。", author: "未知" },
            { text: "阳光总在风雨后，请相信有彩虹。", author: "许美静" },
            { text: "世界很大，幸福很小，有你在刚刚好。", author: "未知" },
            { text: "做自己的太阳，无需凭借谁的光。", author: "未知" },
            { text: "心怀浪漫宇宙，也珍惜人间日常。", author: "未知" },
            { text: "所有失去的，都会以另一种方式归来。", author: "未知" },
            { text: "愿你眼中总有光，活成想要的模样。", author: "未知" },
            { text: "时间会回答所有问题，你只需要耐心等待。", author: "未知" },
            { text: "平凡的日子里，也要闪闪发光。", author: "未知" },
            { text: "爱自己，是终身浪漫的开始。", author: "奥斯卡·王尔德" },
            { text: "生活温暖顺心，其他别无他求。", author: "未知" }
        ];

        function newQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const quote = quotes[randomIndex];
            
            // 添加淡入效果
            const quoteText = document.getElementById('quote');
            const author = document.getElementById('author');
            
            quoteText.style.opacity = 0;
            author.style.opacity = 0;
            
            setTimeout(() => {
                quoteText.textContent = '"' + quote.text + '"';
                author.textContent = '—— ' + quote.author;
                
                quoteText.style.opacity = 1;
                author.style.opacity = 1;
            }, 300);
        }

        // 页面加载时显示第一句
        newQuote();
    </script>
</body>
</html>
